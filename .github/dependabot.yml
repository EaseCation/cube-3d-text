version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    # minor/patch 可以安全合组；major 不分组，让每个破坏性升级独立成一个 PR。
    # 其他仓库把 major 合组后，任何一个升级失败都会让整组 PR 变红而长期无法合并。
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
